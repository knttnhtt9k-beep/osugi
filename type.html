<script src="types-data.js?v=20260929sem22"></script>
<script>
(function () {
  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }
  function markBold(s) {
    return escapeHtml(String(s)).replace(/\*\*(.+?)\*\*/g, '<strong class="hl">$1</strong>');
  }
  function setRich(el, text) {
    if (!el) return;
    if (!text) {
      el.innerHTML = "";
      return;
    }
    var raw = String(text).trim();
    // 強調を先に保護（改行をまたいでも壊れないように）
    var bolds = [];
    raw = raw.replace(/\*\*([\s\S]+?)\*\*/g, function (_, inner) {
      bolds.push(inner);
      return "%%B" + (bolds.length - 1) + "%%";
    });
    var lines = raw.split("\n");
    var out = [];
    var bullets = [];
    function restore(s) {
      var t = escapeHtml(s);
      t = t.replace(/%%B(\d+)%%/g, function (_, i) {
        return '<strong class="hl">' + escapeHtml(bolds[Number(i)]) + "</strong>";
      });
      return t;
    }
    function flush() {
      if (!bullets.length) return;
      out.push(
        '<ul class="bullet-list">' +
          bullets.map(function (l) {
            return "<li>" + restore(l.replace(/^・\s*/, "")) + "</li>";
          }).join("") +
        "</ul>"
      );
      bullets = [];
    }
    lines.forEach(function (line) {
      var t = line.trimEnd();
      if (!t.trim()) {
        flush();
        out.push('<div class="para-gap"></div>');
        return;
      }
      if (/^・/.test(t.trim())) {
        bullets.push(t.trim());
        return;
      }
      flush();
      if (/^※/.test(t.trim())) {
        out.push('<p class="note-line">' + restore(t.trim()) + "</p>");
      } else {
        out.push('<p class="para">' + restore(t.trim()) + "</p>");
      }
    });
    flush();
    el.innerHTML = out.join("");
  }

  var key = (new URLSearchParams(location.search).get("id") || "").toUpperCase();
  var result = window.RESULTS[key];
  if (!result) {
    document.getElementById("page").innerHTML =
      '<div style="padding:40px 22px"><p>タイプが見つかりません。<a href="index.html">診断トップへ</a></p></div>';
    return;
  }

  document.title = result.name + "｜縁の相性診断";
  document.getElementById("typeImage").src = result.image;
  document.getElementById("typeImage").alt = result.name;
  document.getElementById("leadTitle").textContent = result.leadTitle || result.name;
  document.getElementById("leadSub").innerHTML = escapeHtml(result.leadSub || "").replace(/\n/g, "<br>");

  var kw = document.getElementById("typeKeywords");
  (result.keywords || []).forEach(function (k) {
    var span = document.createElement("span");
    span.className = "keyword-chip";
    span.textContent = k;
    kw.appendChild(span);
  });

  setRich(document.getElementById("introText"), result.intro);
  setRich(document.getElementById("featureText"), result.feature);
  setRich(document.getElementById("warnText"), result.warn);
  setRich(document.getElementById("hopeText"), result.hope);
  setRich(document.getElementById("seminarText"), result.seminar);
  setRich(document.getElementById("teacherOsugi"), window.TEACHER_OSUGI || "");
  setRich(document.getElementById("reassureText"), window.REASSURE_COMMON || "");

  // 「セミナーの最初に…」が出た瞬間から追従CTAを出す
  var sticky = document.getElementById("stickyCta");
  var stickyUnlocked = false;
  var triggerPhrase = "セミナーの最初に、はっきりお伝えします";
  var warnRoot = document.getElementById("warnText");
  var triggerEl = null;
  if (warnRoot) {
    Array.prototype.forEach.call(warnRoot.querySelectorAll(".para"), function (p) {
      if (p.textContent.indexOf(triggerPhrase) !== -1) {
        p.id = "stickyTrigger";
        triggerEl = p;
      }
    });
  }
  function updateSticky() {
    if (!sticky || !triggerEl) return;
    var rect = triggerEl.getBoundingClientRect();
    // 文言が画面下から入ってきた瞬間に解放
    if (rect.top < window.innerHeight * 0.9) stickyUnlocked = true;
    sticky.classList.toggle("is-on", stickyUnlocked);
  }
  window.addEventListener("scroll", updateSticky, { passive: true });
  window.addEventListener("resize", updateSticky);
  updateSticky();

  if (result.voiceTitle) {
    document.getElementById("voiceSectionTitle").textContent = result.voiceTitle;
  }
  var cards = document.getElementById("voiceCards");
  (result.voices || []).forEach(function (v) {
    var card = document.createElement("article");
    card.className = "voice-card";

    var photo = document.createElement("div");
    photo.className = "voice-photo";
    var img = document.createElement("img");
    var src = typeof v === "string" ? "" : (v.image || "");
    if (window.EMBED_IMAGES && src.indexOf("images/") === 0) {
      var key = src.replace("images/", "");
      if (window.EMBED_IMAGES[key]) src = window.EMBED_IMAGES[key];
    }
    img.src = src;
    img.alt = (v && v.meta) ? v.meta : "受講者のイメージ";
    img.width = 96;
    img.height = 96;
    img.loading = "lazy";
    photo.appendChild(img);

    var bodyWrap = document.createElement("div");
    bodyWrap.className = "voice-body";
    var text = typeof v === "string" ? v : (v.body || "");
    var meta = typeof v === "string" ? "" : (v.meta || "");
    // 万が一 \n が文字のまま入っていても改行に直す
    text = String(text).replace(/\\n/g, "\n");
    text.split("\n").forEach(function (line) {
      if (!line.trim()) {
        var gap = document.createElement("div");
        gap.className = "voice-gap";
        bodyWrap.appendChild(gap);
        return;
      }
      var p = document.createElement("p");
      p.className = "voice-line";
      p.textContent = line;
      bodyWrap.appendChild(p);
    });
    if (meta) {
      var m = document.createElement("p");
      m.className = "voice-meta";
      m.textContent = "（" + meta + "）";
      bodyWrap.appendChild(m);
    }

    card.appendChild(photo);
    card.appendChild(bodyWrap);
    cards.appendChild(card);
  });
  var vn = document.getElementById("voiceNote");
  if (result.voiceNote) vn.textContent = result.voiceNote;

  document.getElementById("seminarSectionTitle").innerHTML =
    window.SEMINAR_SECTION_TITLE || "";
  setRich(document.getElementById("finalLine"), window.FINAL_LINE || "");
  document.getElementById("finalNote").textContent = window.FINAL_NOTE || "";

  var bannerSrc = window.SEMINAR_BANNER || "images/seminar_banner.jpg";
  document.querySelectorAll(".section-banner img").forEach(function (img) {
    img.src = bannerSrc;
  });

  var url = window.SEMINAR_URL || "https://liff.line.me/2009700161-Cfmz4ETk?booking_event_id=37674&ts=1790607308";
  document.querySelectorAll(".js-seminar").forEach(function (a) {
    a.href = url;
  });
  var mid = document.querySelector(".sec-seminar .primary-btn.js-seminar");
  if (mid) mid.textContent = result.ctaMid || window.SEMINAR_CTA_BUTTON;
  var finalBtn = document.querySelector(".sec-final .primary-btn.js-seminar");
  if (finalBtn) finalBtn.textContent = window.FINAL_BTN;
})();
</script>
